<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF">
<title>速词</title>
<link rel="manifest" href="manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{height:100%}
body{font-family:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif;background:#FFF;color:#111;height:100%;overflow:hidden;margin:0}
#app{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column}
#listView{flex:1;min-height:0;display:flex;flex-direction:column}
.header{display:flex;align-items:center;padding:10px 12px;border-bottom:1px solid #EEE;gap:6px}
.header select{font-size:14px;color:#666;border:none;background:none;padding:4px;-webkit-appearance:none;max-width:45%}
.search-bar{padding:8px 12px;border-bottom:1px solid #EEE}
.search-bar input{width:100%;height:36px;background:#F5F5F5;border:none;border-radius:4px;padding:0 10px;font-size:14px;outline:none}
.tabs{display:flex;padding:0 12px;border-bottom:1px solid #EEE;gap:0}
.tab{font-size:13px;color:#999;padding:10px 12px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.on{color:#111;border-bottom-color:#111}
.tab .num{font-size:11px;color:#BBB;margin-left:2px}
.list{flex:1;min-height:0;overflow-y:auto;padding:0 12px;-webkit-overflow-scrolling:touch}
.word-row{display:flex;align-items:baseline;padding:14px 4px;border-bottom:1px solid #FAFAFA;cursor:pointer;user-select:none;-webkit-user-select:none}
.word-row .ic{font-size:13px;width:22px;text-align:center;margin-right:6px;flex-shrink:0}
.word-row.mastered .ic,.word-row.mastered .w,.word-row.mastered .m{color:#CCC;text-decoration:line-through}
.word-row .w{font-size:18px;font-weight:700;color:#111;min-width:110px;margin-right:10px;pointer-events:none}
.word-row .m{font-size:14px;color:#999;flex:1;line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;pointer-events:none}
.word-row .act{font-size:20px;color:#DDD;padding:0 4px;flex-shrink:0;z-index:1}
.word-row .act:active{color:#999}
.word-row .due-in{font-size:11px;color:#BBB;flex-shrink:0;margin-left:8px}
.empty{text-align:center;color:#CCC;font-size:14px;padding-top:100px}
#detailView,#progressView{display:none;flex-direction:column;height:100vh;overflow-y:auto;padding:0 12px}
.detail-back,.pg-back{font-size:28px;color:#BBB;cursor:pointer;padding:14px 0}
.detail-word{font-size:34px;font-weight:700;margin-bottom:2px}
.detail-stage{font-size:13px;color:#999;margin-bottom:10px}
.detail-phonetic{font-size:14px;color:#666;margin-bottom:4px}
.detail-pos{font-size:13px;color:#999;background:#F5F5F5;display:inline-block;padding:2px 8px;border-radius:2px;margin-bottom:14px}
.sec{margin-top:18px}
.sec h3{font-size:12px;color:#BBB;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid #EEE}
.sec .meanings{font-size:16px;color:#333;line-height:1.8}
.col-row{display:flex;padding:8px 0;border-bottom:1px solid #FAFAFA}
.col-row .ph{font-size:16px;font-weight:700;color:#111;min-width:180px;margin-right:12px}
.col-row .pm{font-size:14px;color:#999}
.sent-row{padding:10px 0;border-bottom:1px solid #FAFAFA}
.sent-row .en{font-size:14px;color:#333;line-height:1.6}
.sent-row .zh{font-size:13px;color:#999;line-height:1.6;margin-top:2px}
.detail-btns{display:flex;gap:12px;margin:28px 0;padding-top:20px;border-top:1px solid #EEE}
.detail-btns button{flex:1;padding:14px;font-size:15px;border-radius:8px;border:1px solid #DDD;background:#FFF;cursor:pointer}
.detail-btns .btn-adv{border-color:#111;color:#111}
.detail-btns .btn-reset{color:#999}
.stats-grid{display:flex;padding:14px 0;border-bottom:1px solid #EEE}
.sc{flex:1;text-align:center}
.sc .nu{font-size:40px;font-weight:700;display:block}
.sc .lb{font-size:11px;color:#BBB;margin-top:2px}
.nu.due{color:#E8A838}.nu.new{color:#4A90D9}.nu.learn{color:#7B9E3F}.nu.ok{color:#999}
.pg-title{font-size:13px;color:#BBB;padding:14px 0 4px}
.mw-row{display:flex;padding:12px 0;border-bottom:1px solid #FAFAFA;text-decoration:line-through;color:#CCC;font-size:14px;align-items:baseline}
.mw-row .mw-w{font-size:15px;min-width:120px;text-decoration:line-through}
.mw-row .mw-m{font-size:13px;flex:1;text-decoration:line-through}
.btn-reset-all{text-align:center;font-size:13px;color:#BBB;padding:24px 0;cursor:pointer}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.4);z-index:999;align-items:center;justify-content:center}
.modal-box{background:#FFF;border-radius:12px;padding:24px;margin:0 40px;text-align:center;max-width:300px;width:100%}
.modal-box h2{font-size:19px;margin-bottom:10px}
.modal-box p{font-size:13px;color:#666;line-height:1.8;white-space:pre-line}
.modal-box button{width:100%;margin-top:16px;padding:12px;font-size:15px;background:#111;color:#FFF;border:none;border-radius:8px;cursor:pointer}
.toast{display:none;position:fixed;top:45%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.75);color:#FFF;padding:10px 20px;border-radius:8px;font-size:13px;z-index:1000}
</style>
</head>
<body>

<div id="app">
<div id="listView">
  <div class="header">
    <select id="libSel"></select>
    <select id="secSel"></select>
  </div>
  <div class="search-bar"><input id="searchInput" placeholder="搜索单词..." autocomplete="off"></div>
  <div class="tabs" id="tabs">
    <span class="tab on" data-filter="all">全部</span>
    <span class="tab" data-filter="due">待复习<span class="num" id="dueNum"></span></span>
    <span class="tab" data-filter="learning">已学<span class="num" id="learnNum"></span></span>
    <span class="tab" data-filter="mastered">已掌握<span class="num" id="okNum"></span></span>
  </div>
  <div class="list" id="wordList"></div>
</div>

<div id="detailView">
  <div class="detail-back" onclick="showList()">‹</div>
  <div id="detailContent"></div>
  <div class="detail-btns">
    <button class="btn-reset" onclick="detailReset()">不认识</button>
    <button class="btn-adv" onclick="detailAdvance()">认识</button>
  </div>
</div>

<div id="progressView">
  <div class="pg-back" onclick="showList()">‹</div>
  <div id="progressContent"></div>
  <div class="btn-reset-all" onclick="resetAll()">一键重置本词库进度</div>
</div>
</div>

<div class="modal-overlay" id="checkinModal"><div class="modal-box"><h2>打卡</h2><p id="checkinMsg"></p><button onclick="closeCheckin()">开始</button></div></div>
<div class="toast" id="toast"></div>

<script src="data/cet6.js"></script>
<script src="data/cet4.js"></script>
<script src="data/postgrad.js"></script>

<script>
var WORD_DATA = {
  cet4: typeof CET4_DATA!=='undefined'?CET4_DATA:[],
  cet6: typeof CET6_DATA!=='undefined'?CET6_DATA:[],
  postgrad: typeof POSTGRAD_DATA!=='undefined'?POSTGRAD_DATA:[]
};
var INTERVALS = [0,86400000,259200000,604800000,1296000000,2592000000];
var SEC = 75;
var LIBS = [{k:'cet4',l:'四级'},{k:'cet6',l:'六级'},{k:'postgrad',l:'考研'}];
var STAGES = ['未学习','第1次','第2次(1天)','第3次(3天)','第4次(7天)','第5次(15天)','已掌握'];

var S = { lib:'cet4', sec:0, filter:'all', dueWords:[], newWords:[], learnWords:[], masterWords:[], detailWord:null, studyStart:Date.now() };

function loadP(){ try{return JSON.parse(localStorage.getItem('qw_v2'))||{}}catch(e){return{}} }
function saveP(p){ try{localStorage.setItem('qw_v2',JSON.stringify(p))}catch(e){} }

function getStage(lib, word){
  var p=loadP(), w=p[lib]&&p[lib].words&&p[lib].words[word];
  return w||{s:0,r:0};
}

function setStage(lib, word, s, r){
  var p=loadP(); if(!p[lib]) p[lib]={words:{}};
  p[lib].words[word]={s:s,r:r};
  saveP(p);
}

function advanceWord(lib, word){
  var st=getStage(lib,word), ns=st.s+1, nr=ns>=6?0:Date.now()+INTERVALS[ns];
  setStage(lib,word,ns>=6?6:ns, nr);
  trackDaily(lib, st.s===0?'newLearned':'reviewed');
}

function resetWord(lib, word){
  setStage(lib,word,1,Date.now()+INTERVALS[1]);
  trackDaily(lib,'reviewed');
}

function masterWord(lib, word){
  setStage(lib,word,6,0);
  trackDaily(lib,'reviewed');
}

function trackDaily(lib, type){
  var p=loadP(), today=getToday();
  if(!p[lib]) p[lib]={words:{}};
  if(!p[lib].daily) p[lib].daily={};
  if(!p[lib].daily[today]) p[lib].daily[today]={reviewed:0,newLearned:0};
  p[lib].daily[today][type]++;
  saveP(p);
}

function getToday(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function pad(n){ return n<10?'0'+n:''+n; }

function shuffle(arr){ var a=[];for(var i=0;i<arr.length;i++)a.push(arr[i]);for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function cssId(s){ return String(s).replace(/[^a-zA-Z0-9_-]/g,'_'); }
function countdown(r){ if(!r)return''; var d=Math.ceil((r-Date.now())/86400000); if(d<=0)return '今天'; if(d===1)return '明天'; return d+'天后'; }

// ====== LOAD SECTION ======
function loadSection(){
  var lib=S.lib, sec=S.sec, all=WORD_DATA[lib]||[];
  var start=sec*SEC, end=Math.min(start+SEC,all.length);
  var secWords=all.slice(start,end);
  var now=Date.now(), due=[], nw=[], lw=[], mw=[];

  for(var i=0;i<secWords.length;i++){
    var w=secWords[i], st=getStage(lib,w.word);
    if(st.s===0) nw.push(w);
    else if(st.s>=1&&st.s<=5&&st.r<=now) due.push(w);
    else if(st.s>=1&&st.s<=5&&st.r>now) lw.push(w);
    else if(st.s>=6) mw.push(w);
  }

  S.dueWords = shuffle(due);
  S.newWords = shuffle(nw);
  S.learnWords = lw.sort(function(a,b){return a.r-b.r;});
  S.masterWords = mw.sort(function(a,b){return a.word>b.word?1:-1;});
  S.filter = 'all';
  updateTabs();
  renderList();
}

// ====== RENDER ======
function renderList(){
  var words=[], q=(document.getElementById('searchInput').value||'').trim().toLowerCase();

  if(S.filter==='all') words = S.dueWords.concat(S.newWords);
  else if(S.filter==='due') words = S.dueWords;
  else if(S.filter==='learning') words = S.learnWords;
  else if(S.filter==='mastered') words = S.masterWords;

  if(q){
    words = words.filter(function(w){
      if(w.word.toLowerCase().indexOf(q)>=0) return true;
      var m=w.meanings||[];
      for(var i=0;i<m.length;i++){ if(m[i].toLowerCase().indexOf(q)>=0) return true; }
      return false;
    });
  }

  var html='';
  for(var i=0;i<words.length;i++){
    var w=words[i], ms=(w.meanings||[]).join(', ');
    var isM = S.filter==='mastered', isL = S.filter==='learning';
    html += '<div class="word-row'+(isM?' mastered':'')+'" id="w_'+cssId(w.word||w.w)+'" data-w="'+esc(w.word||w.w)+'" data-type="'+(isM?'mastered':S.filter)+'">';
    html += '<span class="ic">'+(isL?w.s+'/6':isM?'✓':'')+'</span>';
    html += '<span class="w">'+esc(w.word||w.w)+'</span>';
    html += '<span class="m">'+esc(ms)+'</span>';
    if(isL) html += '<span class="due-in">'+countdown(w.r)+'</span>';
    if(isM) html += '<span class="act" data-act="unmaster">✕</span>';
    else if(!isL) html += '<span class="act" data-act="detail">›</span>';
    html += '</div>';
  }
  if(!html) html='<div class="empty">'+(q?'无匹配单词': S.filter==='mastered'?'暂无已掌握单词':S.filter==='learning'?'暂无学习中的单词':'本节暂无单词')+'</div>';

  document.getElementById('wordList').innerHTML = html;
  bindItems();
}

function updateTabs(){
  document.getElementById('dueNum').textContent = S.dueWords.length>0 ? S.dueWords.length : '';
  document.getElementById('learnNum').textContent = S.learnWords.length>0 ? S.learnWords.length : '';
  document.getElementById('okNum').textContent = S.masterWords.length>0 ? S.masterWords.length : '';

  var tabs = document.querySelectorAll('.tab');
  for(var i=0;i<tabs.length;i++){
    tabs[i].className = tabs[i].dataset.filter===S.filter ? 'tab on' : 'tab';
  }
}

// ====== BIND EVENTS (non-reloading) ======
var touchX=0, touchY=0;

function bindItems(){
  var rows = document.querySelectorAll('.word-row');
  for(var i=0;i<rows.length;i++){
    rows[i].addEventListener('touchstart', function(e){ touchX=e.touches[0].clientX; touchY=e.touches[0].clientY; }, {passive:true});
    rows[i].addEventListener('touchend', onSwipe, {passive:false});
    rows[i].addEventListener('click', onClickRow);
  }

  var acts = document.querySelectorAll('.act');
  for(var i=0;i<acts.length;i++){
    acts[i].addEventListener('click', onActClick);
    acts[i].addEventListener('touchend', function(e){ e.stopPropagation(); });
  }
}

function getRowWord(el){ return el.dataset.w; }

function onSwipe(e){
  var dx=e.changedTouches[0].clientX-touchX, dy=e.changedTouches[0].clientY-touchY;
  var absDx=Math.abs(dx), absDy=Math.abs(dy);
  if(absDx<25 && absDy<25) return; // Click, let onClick handle
  if(absDx<absDy) return; // Vertical scroll, ignore
  e.preventDefault(); // Block subsequent click event
  var word=getRowWord(this); if(!word) return;

  if(dx<-50) { advanceWord(S.lib,word); removeWord(word,'due','new','learning','mastered'); }
  else if(dx>50) { masterWord(S.lib,word); removeWord(word,'due','new','learning'); addToMastered(word); }
}

function onClickRow(e){
  if(e.target.classList.contains('act')) return; // Action button clicked
  var word=getRowWord(this); if(!word) return;
  S.detailWord=word; showDetail();
}

function onActClick(e){
  e.stopPropagation();
  var row=this.parentNode, word=getRowWord(row), act=this.dataset.act;
  if(act==='detail'){ S.detailWord=word; showDetail(); }
  else if(act==='unmaster'){ resetWord(S.lib,word); removeWord(word,'mastered'); }
}

// Remove word from source arrays and DOM (no full reload)
function removeWord(word){
  var sources = Array.prototype.slice.call(arguments, 1);
  for(var s=0;s<sources.length;s++){
    var arr;
    if(sources[s]==='due') arr=S.dueWords;
    else if(sources[s]==='new') arr=S.newWords;
    else if(sources[s]==='learning') arr=S.learnWords;
    else if(sources[s]==='mastered') arr=S.masterWords;
    if(!arr) continue;
    for(var i=0;i<arr.length;i++){ if(arr[i].word===word){ arr.splice(i,1); break; } }
  }
  // Remove DOM element
  var row = document.getElementById('w_'+cssId(word));
  if(row) row.remove();
  // Show empty if needed
  if(!document.querySelector('.word-row')){
    var q=(document.getElementById('searchInput').value||'').trim();
    document.getElementById('wordList').innerHTML='<div class="empty">'+(q?'无匹配单词':S.filter==='mastered'?'暂无已掌握单词':'本节暂无单词')+'</div>';
    bindItems();
  }
  updateTabs();
}

// ====== FILTER TABS ======
document.getElementById('tabs').addEventListener('click', function(e){
  if(!e.target.classList.contains('tab')) return;
  S.filter = e.target.dataset.filter;
  updateTabs();
  renderList();
});

// ====== SEARCH ======
document.getElementById('searchInput').addEventListener('input', function(){ renderList(); });

// ====== SECTIONS & LIBS ======
function buildSelects(){
  var all=WORD_DATA[S.lib]||[], count=Math.ceil(all.length/SEC);
  var lsel=document.getElementById('libSel'), ssel=document.getElementById('secSel');
  lsel.innerHTML=''; ssel.innerHTML='';
  for(var i=0;i<LIBS.length;i++){ lsel.innerHTML+='<option value="'+LIBS[i].k+'">'+LIBS[i].l+'</option>'; }
  lsel.value=S.lib;
  for(var i=0;i<count;i++){ var a=i*SEC+1,b=Math.min((i+1)*SEC,all.length); ssel.innerHTML+='<option value="'+i+'">第'+(i+1)+'节('+a+'-'+b+')</option>'; }
  ssel.value=S.sec;
}
document.getElementById('libSel').addEventListener('change',function(){S.lib=this.value;S.sec=0;buildSelects();loadSection();});
document.getElementById('secSel').addEventListener('change',function(){S.sec=parseInt(this.value);loadSection();});

// ====== VIEW SWITCH ======
function showList(){
  document.getElementById('listView').style.display='flex';
  document.getElementById('detailView').style.display='none';
  document.getElementById('progressView').style.display='none';
  renderList();
}

function showDetail(){
  document.getElementById('listView').style.display='none';
  document.getElementById('detailView').style.display='flex';
  var lib=S.lib, word=S.detailWord, data=findWord(lib,word);
  if(!data){ toast('未找到'); showList(); return; }
  var st=getStage(lib,word);
  var html='<div class="detail-word">'+esc(word)+'</div>';
  html+='<div class="detail-stage">'+STAGES[Math.min(st.s,6)]+'</div>';
  if(data.phonetic_uk) html+='<div class="detail-phonetic">英 /'+esc(data.phonetic_uk)+'/  美 /'+esc(data.phonetic_us||data.phonetic_uk)+'/</div>';
  if(data.pos) html+='<div class="detail-pos">'+esc(data.pos)+'</div>';
  html+='<div class="sec"><h3>释义</h3><div class="meanings">'+(data.meanings||[]).join('，')+'</div></div>';
  if(data.collocations&&data.collocations.length){
    html+='<div class="sec"><h3>固定搭配</h3>';
    for(var i=0;i<data.collocations.length;i++){ var c=data.collocations[i]; html+='<div class="col-row"><span class="ph">'+esc(c.phrase)+'</span><span class="pm">'+esc(c.meaning)+'</span></div>'; }
    html+='</div>';
  }
  document.getElementById('detailContent').innerHTML=html;
  document.getElementById('progressView').style.display='none';
}

function detailAdvance(){ advanceWord(S.lib,S.detailWord); toast('已认识'); removeFromAny(S.detailWord); showList(); }
function detailReset(){ resetWord(S.lib,S.detailWord); toast('不认识，退回底部'); S.dueWords.push(findWord(S.lib,S.detailWord)); showList(); }

function showProgress(){
  document.getElementById('listView').style.display='none';
  document.getElementById('detailView').style.display='none';
  document.getElementById('progressView').style.display='flex';
  var lib=S.lib, all=WORD_DATA[lib]||[], p=loadP(), words=(p[lib]&&p[lib].words)||{};
  var stats={due:0,new:0,learn:0,ok:0}, mastered=[], now=Date.now();
  for(var i=0;i<all.length;i++){
    var s=words[all[i].word]||{s:0,r:0};
    if(s.s===0) stats.new++; else if(s.s>=1&&s.s<=5&&s.r<=now) stats.due++; else if(s.s>=1&&s.s<=5&&s.r>now) stats.learn++; else if(s.s>=6){ stats.ok++; if(mastered.length<80) mastered.push(all[i]); }
  }
  var lb=LIBS.find(function(l){return l.k===lib;}).l;
  var html='<div style="font-size:13px;color:#999;padding-bottom:6px">'+lb+' · '+all.length+' 词</div>';
  html+='<div class="stats-grid"><div class="sc"><span class="nu due">'+stats.due+'</span><span class="lb">待复习</span></div><div class="sc"><span class="nu new">'+stats.new+'</span><span class="lb">未学</span></div><div class="sc"><span class="nu learn">'+stats.learn+'</span><span class="lb">学习中</span></div><div class="sc"><span class="nu ok">'+stats.ok+'</span><span class="lb">已掌握</span></div></div>';
  if(mastered.length){
    html+='<div class="pg-title">已掌握单词</div>';
    for(var i=0;i<mastered.length;i++){ var w=mastered[i]; html+='<div class="mw-row"><span class="mw-w">'+esc(w.word)+'</span><span class="mw-m">'+(w.meanings||[]).join('，')+'</span></div>'; }
  }
  document.getElementById('progressContent').innerHTML=html;
}

function resetAll(){ if(confirm('确定清空当前词库所有进度？')){ var p=loadP();delete p[S.lib];saveP(p);showProgress();} }
function findWord(lib,word){ var all=WORD_DATA[lib]||[]; for(var i=0;i<all.length;i++){if(all[i].word===word)return all[i];} return null; }
function removeFromAny(word){
  removeWord(word,'due','new','learning','mastered');
  updateTabs();
}

function addToMastered(word){
  var w = findWord(S.lib, word);
  if(w) S.masterWords.push(w);
}

function toast(msg){ var t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(function(){t.style.display='none';},1200); }

// ====== CHECK-IN ======
function checkIn(){
  var p=loadP(), lib=S.lib, today=getToday();
  if(!p[lib]) p[lib]={words:{}};
  if(p[lib]._lastCheckin===today) return;
  // Save study duration from last session
  if(p[lib]._studyStart){
    var dur = Math.round((Date.now()-p[lib]._studyStart)/60000);
    if(!p[lib]._lastDuration) p[lib]._lastDuration=dur;
  }
  p[lib]._studyStart = Date.now();
  p[lib]._lastCheckin=today; saveP(p);

  var now = new Date();
  var weekDays = ['日','一','二','三','四','五','六'];
  var dateStr = now.getFullYear()+'年'+(now.getMonth()+1)+'月'+now.getDate()+'日 星期'+weekDays[now.getDay()];
  var y = getYtd(lib);
  var dur = p[lib]._lastDuration || 0;

  var Q=['不积跬步，无以至千里。','每天进步一点点，坚持带来大改变。','学习是灯，努力是油。','你所背的每一个单词，都是未来的垫脚石。','今日记一词，明日进一步。','放弃不难，但坚持一定很酷。','世界上最快的捷径，就是脚踏实地。'];
  var q=Q[Math.floor(Math.random()*Q.length)];

  var m = dateStr+'\n';
  if(y) m += '昨日复习 '+y.reviewed+' 词 · 新学 '+y.newLearned+' 词';
  else m += '昨日未学习';
  m += '\n昨日学习 '+dur+' 分钟';
  m += '\n\n今日待复习 '+S.dueWords.length+' 词';
  m += '\n\n'+q;

  document.getElementById('checkinMsg').textContent=m;
  document.getElementById('checkinModal').style.display='flex';
}
function closeCheckin(){ document.getElementById('checkinModal').style.display='none'; }
function getYtd(lib){ var p=loadP(),d=new Date();d.setDate(d.getDate()-1);var y=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());if(p[lib]&&p[lib].daily&&p[lib].daily[y])return p[lib].daily[y];return null; }

// ====== MIGRATION ======
var P0=loadP();
if(!P0._migrated){
  var old=localStorage.getItem('quickwords_progress');
  if(old){ try{ var o=JSON.parse(old); LIBS.forEach(function(l){ if(o[l.k]&&o[l.k].learned){ if(!P0[l.k])P0[l.k]={words:{}}; o[l.k].learned.forEach(function(w){P0[l.k].words[w]={s:6,r:0};}); } }); }catch(e){} }
  P0._migrated=true; saveP(P0);
}

// ====== INIT ======
buildSelects();
loadSection();
document.getElementById('searchInput').value='';
window.addEventListener('beforeunload', function(){
  var p=loadP(), lib=S.lib;
  if(!p[lib]) p[lib]={words:{}};
  p[lib]._studyStart = Date.now();
  saveP(p);
});
setTimeout(checkIn,600);
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
